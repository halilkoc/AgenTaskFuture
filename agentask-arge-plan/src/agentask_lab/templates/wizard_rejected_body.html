{% set vh = new_id() %}{% set vi = new_id() %}{% set rh = new_id() %}{% set ri = new_id() %}
<div class="wizard" data-case-id="{{ case_id }}" data-step="rejected">
<h1>Başvuru — red bilgisi</h1>
<section aria-labelledby="{{ vh }}" class="panel"><h2 id="{{ vh }}">Vaka</h2>
  <label for="{{ vi }}">Vaka No</label><input id="{{ vi }}" name="{{ new_id() }}" value="{{ case_id }}" readonly>
</section>
<section aria-labelledby="{{ rh }}" class="panel"><h2 id="{{ rh }}">Red Nedeni</h2>
  <label for="{{ ri }}">Açıklama</label><input id="{{ ri }}" name="{{ new_id() }}">
</section>
</div>
