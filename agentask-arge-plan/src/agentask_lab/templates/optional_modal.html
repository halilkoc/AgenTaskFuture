{% extends "base.html" %}
{% block title %}İsteğe bağlı pencere{% endblock %}
{% block content %}
<h1>İsteğe bağlı pencere</h1>
<section aria-label="Bilgiler">
  {% set i = new_id() %}<div class="field"><label for="{{ i }}">Birinci</label><input id="{{ i }}" name="{{ new_id() }}" class="xfirst"></div>
  {% set i = new_id() %}<div class="field"><label for="{{ i }}">İkinci</label><input id="{{ i }}" name="{{ new_id() }}"></div>
</section>
{% set i = new_id() %}<section aria-label="Üst Bilgi"><div class="field"><label for="{{ i }}">Referans No</label><input id="{{ i }}" name="{{ new_id() }}"></div></section>
<p id="clicks" data-ok="0" data-cancel="0"></p>
{% endblock %}
{% block scripts %}<script>
const mode = new URLSearchParams(location.search).get("mode");
const counter = document.getElementById("clicks");
function dialog(text) {
  const d = document.createElement("div");
  d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Bilgilendirme");
  d.style.cssText = "position:fixed;inset:20% 20%;background:#fff;border:1px solid #000;padding:16px;z-index:10";
  d.innerHTML = `<p>${text}</p><button type="button">Tamam</button><button type="button">İptal</button>`;
  const [ok, cancel] = d.querySelectorAll("button");
  ok.addEventListener("click", () => { counter.dataset.ok = String(+counter.dataset.ok + 1); d.remove(); });
  cancel.addEventListener("click", () => { counter.dataset.cancel = String(+counter.dataset.cancel + 1); d.remove(); });
  document.body.appendChild(d);
}
let shown = false;
document.querySelector(".xfirst").addEventListener("input", () => {
  if (shown) return; shown = true;
  setTimeout(() => {
    if (mode === "info") dialog("Kaydınız işleniyor");
    if (mode === "other") dialog("Hesabınız kapatılacak");
    if (mode === "two") { dialog("Kaydınız işleniyor"); dialog("Kaydınız işleniyor"); }
  }, 30);
});
</script>{% endblock %}
